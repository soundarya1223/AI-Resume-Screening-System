<!DOCTYPE html>
<html>

<head>

<title>
Resume Analysis Result
</title>


<link rel="stylesheet" href="/static/css/style.css">

</head>


<body>


<div class="container">


<h1>
Resume Analysis Result
</h1>


<h2>
Match Score
</h2>


<h1>
{{ score }}%
</h1>



<h2>
Skills Found in Resume
</h2>


<div>

{% for skill in matched %}

<span class="skill">
{{ skill }}
</span>

{% endfor %}

</div>



<h2>
Skills Missing for This Job
</h2>


<div>

{% for skill in missing %}

<span class="missing">
{{ skill }}
</span>

{% endfor %}

</div>



<br>


<a href="/">
<button>
Analyze Another Resume
</button>
</a>



</div>


</body>

</html>
